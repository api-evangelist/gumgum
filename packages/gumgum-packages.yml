method: searched
source: >-
  npm registry search and per-package metadata (registry.npmjs.org), plus the public GumGum GitHub
  organization (github.com/gumgum) — probed 2026-08-01.
note: >-
  GumGum publishes NO client SDK for the GumGum Contextual API. The Contextual API is documented as
  a plain server-to-server HTTPS integration authenticated with an X-api-key header, and the docs
  offer no first-party client library in any language. The first-party packages GumGum does publish
  are front-end/UI libraries used to build its own products, plus a long-unmaintained iOS ad-serving
  SDK. Because none of them is a client for the Contextual API, no `SDKs` pointer is wired in
  apis.yml — doing so would credit an API-client surface that does not exist. The UI libraries are
  also catalogued in components/gumgum-components.yml.

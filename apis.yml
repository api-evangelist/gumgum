  - name: GumGum Prebid Header Bidding Endpoint
    description: >-
      GumGum's real-time bidding endpoint for header bidding, integrated through the open-source
      Prebid.js gumgumBidAdapter (bidder code gumgum, alias gg, IAB GVL ID 61). Supports banner,
      native and video media types. Bid requests are POSTed to the hbid/imp path by the adapter.
    humanURL: https://docs.prebid.org/dev-docs/bidders/gumgum.html
    baseURL: https://g2.gumgum.com
    tags:

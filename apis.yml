apis:
  - name: GumGum Contextual API
    description: >-
      Server-to-server REST API returning content-level contextual classification, brand safety and
      suitability, and sentiment analysis for web pages, video (including audio), individual video
      frames, images and raw text. Analysis is asynchronous: submit an asset, receive a UUID, then
      poll for the result or supply a callback URL for webhook delivery. Authenticated with an
      X-api-key request header.
    humanURL: https://gumgum.jira.com/wiki/spaces/VDC
    baseURL: https://verity-api.gumgum.com
    tags:

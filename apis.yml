aid: gumgum
name: GumGum
description: >-
  GumGum is a Santa Monica-based advertising technology company, founded in 2008, that sells
  contextual, CTV/online-video and high-impact display advertising built on its own content
  intelligence. Its GumGum Contextual platform (formerly Verity) uses in-house computer vision and
  natural language processing to read the text, images, video and audio of a page or asset before
  the bid, returning IAB Content Taxonomy classifications (v1, v2 and v3), extracted keywords,
  named entities, brand-safety and suitability threats, and sentiment. That analysis is exposed to
  publishers, DSPs, agencies and advertisers as a server-to-server REST API at
  verity-api.gumgum.com with separate Page, Video, Intravideo, Image and Text surfaces, plus an
  asynchronous webhook callback for delivering completed classifications. GumGum also ships an
  open-source Prebid.js bid adapter for header bidding, and holds Media Rating Council
  accreditation for content-level classification across desktop, mobile web and CTV.

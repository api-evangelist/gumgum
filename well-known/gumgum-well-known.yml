source: live GET probes of the /.well-known/ surface on every GumGum host in apis.yml and openapi/servers[]
note: >-
  No GumGum-operated host publishes a /.well-known/ discovery document. The API host
  (verity-api.gumgum.com) is an AWS API Gateway deployment that answers every unmatched path with
  HTTP 403 {"message":"Missing Authentication Token"}, so no /.well-known/ path resolves there.
  gumgum.com (Webflow) returns 404 for every probed path. The two security.txt documents that DO
  return 200 are served by third-party SaaS vendors on GumGum subdomains — Atlassian Statuspage
  (status.contextual.gumgum.com) and Atlassian Confluence Cloud (gumgum.jira.com) — and are
  Atlassian's own RFC 9116 policies, not GumGum's. They are recorded here as evidence but are
  deliberately NOT saved as a GumGum security.txt and NOT wired as a SecurityTxt or Security
  pointer, because they do not represent a GumGum vulnerability-disclosure program.
